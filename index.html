<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedCard QR - Acesso Rápido</title>
    <!-- Tailwind CSS para Estilização Mobile-First -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // Configuração para utilizar ícones
        const { useState, useEffect } = React;

        function App() {
            // Gerenciamento de Estado de Telas (Roteamento simples)
            const [currentView, setCurrentView] = useState('login');
            const [currentUser, setCurrentUser] = useState(null);
            const [emergencyTarget, setEmergencyTarget] = useState(null);

            // Banco de Dados Simulado (LocalStorage) para o projeto rodar na entrega
            const [db, setDb] = useState(() => JSON.parse(localStorage.getItem('medcard_db')) || {});

            const saveDb = (newDb) => {
                setDb(newDb);
                localStorage.setItem('medcard_db', JSON.stringify(newDb));
            };

            // Regex de Segurança (Feedback do Professor)
            const isPasswordSecure = (pwd) => /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/.test(pwd);

            // TELA 1: LOGIN E CADASTRO
            const LoginView = () => {
                const [isRegister, setIsRegister] = useState(false);
                const [email, setEmail] = useState('');
                const [password, setPassword] = useState('');
                const [error, setError] = useState('');

                const handleSubmit = (e) => {
                    e.preventDefault();
                    if (isRegister) {
                        if (!isPasswordSecure(password)) {
                            setError('A senha deve ter 8+ chars, 1 maiúscula, 1 número e 1 símbolo (@$!%*?&).');
                            return;
                        }
                        if (db[email]) {
                            setError('Usuário já existe!');
                            return;
                        }
                        const newDb = { ...db, [email]: { password, ficha: null, publicPin: null } };
                        saveDb(newDb);
                        alert('Conta criada! Faça login.');
                        setIsRegister(false);
                    } else {
                        if (db[email] && db[email].password === password) {
                            setCurrentUser(email);
                            setCurrentView('dashboard');
                        } else {
                            setError('E-mail ou senha incorretos.');
                        }
                    }
                };

                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-white p-8 rounded-xl shadow-xl w-full max-w-md">
                            <div className="flex justify-center mb-6">
                                <div className="bg-blue-600 p-3 rounded-full"><i data-lucide="activity" className="text-white w-8 h-8"></i></div>
                            </div>
                            <h2 className="text-2xl font-bold text-center text-slate-800 mb-6">MedCard QR</h2>
                            
                            {error && <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm">{error}</div>}
                            
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-1">E-mail Corporativo</label>
                                    <input type="email" required className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" value={email} onChange={e => setEmail(e.target.value)} />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-1">Senha Segura</label>
                                    <input type="password" required className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" value={password} onChange={e => setPassword(e.target.value)} />
                                </div>
                                <button type="submit" className="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition">
                                    {isRegister ? 'Criar Conta' : 'Entrar no Sistema'}
                                </button>
                            </form>
                            
                            <p className="mt-4 text-center text-sm text-slate-600 cursor-pointer hover:text-blue-600" onClick={() => { setIsRegister(!isRegister); setError(''); }}>
                                {isRegister ? 'Já tenho uma conta. Entrar.' : 'Novo colaborador? Crie sua conta.'}
                            </p>
                            
                            <div className="mt-8 pt-4 border-t text-center">
                                <p className="text-xs text-slate-500 mb-2">Simulação de QR Code lido pelo socorrista:</p>
                                <button onClick={() => { setEmergencyTarget('exemplo@empresa.com'); setCurrentView('emergency_auth'); }} className="text-sm bg-slate-800 text-white px-3 py-1 rounded">Simular Leitura de Crachá</button>
                            </div>
                        </div>
                    </div>
                );
            };

            // TELA 2: DASHBOARD DO COLABORADOR
            const DashboardView = () => {
                const userObj = db[currentUser];
                const [nome, setNome] = useState(userObj.ficha?.nome || '');
                const [tipoSangue, setTipoSangue] = useState(userObj.ficha?.tipoSangue || '');
                const [alergias, setAlergias] = useState(userObj.ficha?.alergias || '');
                const [contato, setContato] = useState(userObj.ficha?.contato || '');
                const [pin, setPin] = useState(userObj.publicPin || '');
                const [showModal, setShowModal] = useState(false); // Para exclusão

                const handleSave = (e) => {
                    e.preventDefault();
                    if (!isPasswordSecure(pin)) {
                        alert('A Senha Pública deve ter 8+ chars, 1 maiúscula, 1 número e 1 símbolo (@$!%*?&).');
                        return;
                    }
                    const newDb = { ...db };
                    newDb[currentUser].ficha = { nome, tipoSangue, alergias, contato };
                    newDb[currentUser].publicPin = pin;
                    saveDb(newDb);
                    alert('Dados e QR Code atualizados com sucesso!');
                };

                const handleDelete = () => {
                    const newDb = { ...db };
                    delete newDb[currentUser];
                    saveDb(newDb);
                    alert('Conta e dados clínicos excluídos permanentemente.');
                    setCurrentUser(null);
                    setCurrentView('login');
                };

                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=medcard://${currentUser}`;

                return (
                    <div className="max-w-4xl mx-auto p-4 md:p-8">
                        <div className="flex justify-between items-center mb-8">
                            <h1 className="text-2xl font-bold text-slate-800">Minha Ficha Médica</h1>
                            <button onClick={() => {setCurrentUser(null); setCurrentView('login');}} className="text-slate-500 hover:text-slate-800 font-bold">Sair</button>
                        </div>

                        <div className="grid md:grid-cols-3 gap-6">
                            <div className="md:col-span-2 bg-white p-6 rounded-xl shadow-md">
                                <h2 className="text-lg font-bold text-slate-700 mb-4 border-b pb-2">Dados Clínicos e Contato</h2>
                                <form onSubmit={handleSave} className="space-y-4">
                                    <div><label className="text-sm font-bold text-slate-700">Nome Completo</label><input type="text" required value={nome} onChange={e=>setNome(e.target.value)} className="w-full border p-2 rounded" /></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-sm font-bold text-slate-700">Tipo Sanguíneo</label><input type="text" placeholder="Ex: O+" value={tipoSangue} onChange={e=>setTipoSangue(e.target.value)} className="w-full border p-2 rounded" /></div>
                                        <div><label className="text-sm font-bold text-slate-700">Contato Emergência</label><input type="text" placeholder="Nome - Telefone" value={contato} onChange={e=>setContato(e.target.value)} className="w-full border p-2 rounded" /></div>
                                    </div>
                                    <div><label className="text-sm font-bold text-slate-700">Alergias Graves</label><textarea value={alergias} onChange={e=>setAlergias(e.target.value)} className="w-full border p-2 rounded" rows="2"></textarea></div>
                                    
                                    <h2 className="text-lg font-bold text-slate-700 mt-6 mb-2 border-b pb-2">Segurança do Crachá</h2>
                                    <div><label className="text-sm font-bold text-red-600">Senha Pública de Acesso (Imprimir no Crachá)</label><input type="text" required value={pin} onChange={e=>setPin(e.target.value)} placeholder="Ex: Med@2026" className="w-full border-2 border-red-300 bg-red-50 p-2 rounded focus:outline-none focus:border-red-500" /></div>
                                    
                                    <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition mt-4">Salvar Dados e Gerar QR Code</button>
                                </form>
                            </div>

                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-xl shadow-md flex flex-col items-center border-t-4 border-slate-800">
                                    <h3 className="font-bold text-slate-800 mb-2 text-center">Crachá de Emergência</h3>
                                    {userObj.ficha && userObj.publicPin ? (
                                        <>
                                            <img src={qrUrl} alt="QR Code" className="border-4 border-slate-100 rounded-lg p-2 mb-4" />
                                            <div className="bg-red-100 text-red-800 px-4 py-2 rounded-lg font-mono font-bold border border-red-300 w-full text-center">PIN: {pin}</div>
                                            <p className="text-xs text-center text-slate-500 mt-2">Pronto para impressão.</p>
                                        </>
                                    ) : (
                                        <p className="text-sm text-center text-slate-500 py-8">Preencha e salve os dados ao lado para gerar o QR Code.</p>
                                    )}
                                </div>

                                <button onClick={() => setShowModal(true)} className="w-full bg-red-50 border border-red-200 text-red-600 font-bold py-2 rounded-lg hover:bg-red-100 transition">Excluir Conta</button>
                            </div>
                        </div>

                        {/* Modal de Exclusão (Resolve a US05) */}
                        {showModal && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                                <div className="bg-white rounded-xl p-6 max-w-sm w-full">
                                    <h3 className="text-xl font-bold text-red-600 mb-2">Atenção!</h3>
                                    <p className="text-slate-700 mb-6">Tem certeza que deseja excluir sua conta? Seus dados serão apagados e seu QR Code impresso parará de funcionar permanentemente.</p>
                                    <div className="flex gap-2">
                                        <button onClick={() => setShowModal(false)} className="flex-1 bg-slate-200 text-slate-800 py-2 rounded font-bold">Cancelar</button>
                                        <button onClick={handleDelete} className="flex-1 bg-red-600 text-white py-2 rounded font-bold">Sim, Excluir</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // TELA 3: AUTENTICAÇÃO DO SOCORRISTA
            const EmergencyAuth = () => {
                const [pinInput, setPinInput] = useState('');
                const [error, setError] = useState('');

                const handleVerify = () => {
                    const user = db[emergencyTarget];
                    // Simulando o Backend negando acesso
                    if (!user) {
                        setError('Registro não encontrado. O colaborador pode ter excluído a conta.');
                        return;
                    }
                    if (user.publicPin !== pinInput) {
                        setError('Acesso Negado: Senha Pública Incorreta.');
                        return;
                    }
                    setCurrentView('emergency_view');
                };

                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-slate-900 p-4">
                        <div className="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm text-center">
                            <div className="bg-red-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-red-500/50">
                                <i data-lucide="lock" className="text-white w-8 h-8"></i>
                            </div>
                            <h2 className="text-xl font-bold text-slate-800 mb-2">Ficha Bloqueada</h2>
                            <p className="text-sm text-slate-500 mb-6">Digite a Senha Pública impressa no crachá do colaborador para visualizar os dados médicos.</p>
                            
                            {error && <div className="bg-red-100 text-red-700 p-2 rounded mb-4 text-sm font-bold">{error}</div>}
                            
                            <input type="text" placeholder="Senha do Crachá" value={pinInput} onChange={e=>setPinInput(e.target.value)} className="w-full text-center text-xl tracking-widest px-4 py-3 border-2 border-slate-300 rounded-lg mb-4 focus:border-red-500 focus:outline-none font-mono" />
                            <button onClick={handleVerify} className="w-full bg-red-600 text-white font-bold py-3 rounded-lg hover:bg-red-700 transition shadow-lg">Desbloquear Dados</button>
                            <button onClick={() => setCurrentView('login')} className="mt-4 text-slate-400 text-sm">Voltar ao Início</button>
                        </div>
                    </div>
                );
            };

            // TELA 4: FICHA DE EMERGÊNCIA (MOBILE FIRST)
            const EmergencyView = () => {
                const dados = db[emergencyTarget].ficha;

                return (
                    <div className="min-h-screen bg-slate-100 p-4 pb-24 md:flex md:justify-center">
                        <div className="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border-4 border-slate-800 relative">
                            <div className="bg-red-600 text-white p-4 text-center">
                                <h1 className="text-lg font-bold flex items-center justify-center gap-2">
                                    <i data-lucide="alert-triangle"></i> FICHA DE EMERGÊNCIA
                                </h1>
                                <p className="text-xs text-red-200 mt-1">Acesso Autenticado</p>
                            </div>
                            
                            <div className="p-5">
                                <p className="text-xs font-bold text-slate-500">PACIENTE</p>
                                <p className="text-2xl font-bold text-slate-800 border-b pb-4 mb-4">{dados.nome}</p>

                                {dados.alergias && (
                                    <div className="bg-red-50 border border-red-200 rounded-lg p-4 mb-4">
                                        <p className="text-sm font-bold text-red-700 flex items-center gap-2 mb-1">
                                            <i data-lucide="shield-alert" className="w-4 h-4"></i> ALERGIAS GRAVES
                                        </p>
                                        <p className="text-red-900 font-medium">{dados.alergias}</p>
                                    </div>
                                )}

                                <div className="flex justify-between items-center bg-blue-50 p-4 rounded-lg mb-4">
                                    <p className="text-sm font-bold text-slate-600">Tipo Sanguíneo</p>
                                    <p className="text-xl font-bold text-blue-700">{dados.tipoSangue}</p>
                                </div>

                                <div className="bg-green-50 border border-green-200 rounded-lg p-4 mb-4">
                                    <p className="text-sm font-bold text-green-700 flex items-center gap-2 mb-1">
                                        <i data-lucide="phone-call" className="w-4 h-4"></i> CONTATO
                                    </p>
                                    <p className="text-green-900 font-bold">{dados.contato}</p>
                                </div>
                            </div>
                            
                            <div className="bg-slate-50 p-4 border-t flex gap-2">
                                <a href="tel:192" className="flex-1 bg-green-600 text-white text-center font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-lg">
                                    <i data-lucide="ambulance" className="w-5 h-5"></i> LIGAR 192
                                </a>
                                <button onClick={() => setCurrentView('login')} className="px-4 py-3 bg-slate-200 text-slate-700 rounded-xl font-bold">Sair</button>
                            </div>
                        </div>
                    </div>
                );
            };

            // Roteador Básico
            return (
                <>
                    {currentView === 'login' && <LoginView />}
                    {currentView === 'dashboard' && <DashboardView />}
                    {currentView === 'emergency_auth' && <EmergencyAuth />}
                    {currentView === 'emergency_view' && <EmergencyView />}
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Iniciar ícones Lucide após renderização
        setTimeout(() => { lucide.createIcons(); }, 100);
    </script>
</body>
</html>
